name: build-analyzer

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"

      - uses: gradle/actions/setup-gradle@v6

      - name: Build, test, static analysis, coverage
        run: ./gradlew check

      - name: Build Fat-JAR
        run: ./gradlew shadowJar

      # -XX:+UseCompactObjectHeaders (JEP 519, JDK 25, off by default) is
      # part of the documented Fat-JAR invocation — the sanity run starts
      # with it enabled so a regression in the flag breaks this job.
      - name: Sanity - Fat-JAR starts
        run: java -XX:+UseCompactObjectHeaders -jar cli/build/libs/reachability-analyzer-0.1.0-SNAPSHOT-all.jar --help

  # M7d: the native-image binary (A2). GraalVM JDK 25 provides the
  # native-image compiler; `check` above stays under plain Temurin.
  native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: graalvm/setup-graalvm@v1
        with:
          version: "25.4"
          java-version: "25"
          distribution: "graalvm-community"

      # Gradle user-home caching is setup-gradle's default enhanced state
      # caching (⚡ in the job UI) — the graalvm action's own
      # `cache: "gradle"` (classic actions/cache) was dropped so one
      # mechanism caches, not two. The key is build-file + JDK-version
      # based, so this job may share the entry with `build` (both Java
      # 25): the dependency cache is JDK-agnostic and a concurrent save
      # simply loses to the first.
      - uses: gradle/actions/setup-gradle@v6

      - name: Build the native binary
        run: ./gradlew :cli:nativeCompile

      - name: Sanity - native binary starts
        run: cli/build/native/nativeCompile/cli --version

      - name: Upload native binary
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reachability-analyzer-native
          path: cli/build/native/

  # Docker delivery of the native binary (ADR 0022): the artifact from the
  # `native` job packaged as a FROM-scratch image, published to GitHub
  # Packages. PRs cannot push to packages (read-only token), so the job
  # runs on push only; `packages: write` is granted at job level, not
  # workflow level.
  docker:
    needs: native
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Download native binary
        uses: actions/download-artifact@v7
        with:
          name: reachability-analyzer-native

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          # Only the binary's directory is the build context — the 21.5 MB
          # binary, nothing else, reaches the builder.
          context: reachability-analyzer-native/nativeCompile
          file: docker/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/reachability-analyzer:latest
            ghcr.io/${{ github.repository_owner }}/reachability-analyzer:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

  # M7e: the Maven plugin (A10) — a separate Maven build inside the Gradle
  # repo (recorded deviation). The script publishes :core locally, installs
  # the plugin, and runs reachability:check on the demo: the vulnerable
  # log4j pin must fail with reports, the fixed pin must pass.
  maven-plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
          # The e2e script builds the plugin and the demo with Maven;
          # without this every run re-downloads the whole ~/.m2.
          cache: maven

      - uses: gradle/actions/setup-gradle@v6

      # A14: the snapshot is gitignored, so a fresh checkout lacks it.
      # Key the cache by the remote zip's ETag (changes with every
      # upstream re-upload, so a new snapshot invalidates the entry)
      # and cache the pin file with the directory — the script writes
      # it next to, not inside, the directory. The URL mirrors the one
      # in scripts/download-osv.sh.
      - name: Detect OSV snapshot version
        id: osv-etag
        run: |
          etag="$(curl -fsSLI --retry 3 \
              https://osv-vulnerabilities.storage.googleapis.com/Maven/all.zip \
              | grep -i '^etag:' | head -1 | cut -d' ' -f2 | tr -d '\r\"')"
          [ -n "$etag" ] || { echo "FATAL: no ETag header from the snapshot URL"; exit 1; }
          echo "etag=$etag" >> "$GITHUB_OUTPUT"

      - name: Restore OSV snapshot
        id: osv-cache
        uses: actions/cache/restore@v6
        with:
          path: |
            osv-maven
            osv-maven.sha256
          key: osv-maven-${{ steps.osv-etag.outputs.etag }}

      - name: Download OSV Maven snapshot
        if: steps.osv-cache.outputs.cache-hit != 'true'
        run: bash scripts/download-osv.sh osv-maven

      - name: Save OSV snapshot
        if: steps.osv-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            osv-maven
            osv-maven.sha256
          key: osv-maven-${{ steps.osv-etag.outputs.etag }}

      - name: End-to-end (demo 2.14.1 red / 2.25.5 green)
        run: bash scripts/maven-plugin-e2e.sh
