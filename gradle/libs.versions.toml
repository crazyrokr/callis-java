# Single source of truth for every dependency pin (see docs/adr/0001-architecture.md).
[versions]
jackson = "2.22.4"
picocli = "4.7.7"
mavenArtifact = "3.10.0"
sootup = "3.0.1"
spock = "2.5-groovy-6.0"
groovy = "6.0.0"
checkstyle = "14.3.0"
jacoco = "0.8.15"
spotbugs = "4.10.5"

[libraries]
jackson-databind = { module = "com.fasterxml.jackson.core:jackson-databind", version.ref = "jackson" }
picocli = { module = "info.picocli:picocli", version.ref = "picocli" }
maven-artifact = { module = "org.apache.maven:maven-artifact", version.ref = "mavenArtifact" }
sootup-core = { module = "org.soot-oss:sootup.core", version.ref = "sootup" }
sootup-java-core = { module = "org.soot-oss:sootup.java.core", version.ref = "sootup" }
sootup-bytecode-frontend = { module = "org.soot-oss:sootup.java.bytecode.frontend", version.ref = "sootup" }
sootup-jimple-frontend = { module = "org.soot-oss:sootup.jimple.frontend", version.ref = "sootup" }
sootup-callgraph = { module = "org.soot-oss:sootup.callgraph", version.ref = "sootup" }
sootup-spark = { module = "org.soot-oss:sootup.spark", version.ref = "sootup" }
spock-core = { module = "org.spockframework:spock-core", version.ref = "spock" }
groovy = { module = "org.apache.groovy:groovy", version.ref = "groovy" }
groovy-bom = { module = "org.apache.groovy:groovy-bom", version.ref = "groovy" }
groovy-ant = { module = "org.apache.groovy:groovy-ant", version.ref = "groovy" }
groovy-json = { module = "org.apache.groovy:groovy-json", version.ref = "groovy" }
groovy-templates = { module = "org.apache.groovy:groovy-templates", version.ref = "groovy" }
groovy-xml = { module = "org.apache.groovy:groovy-xml", version.ref = "groovy" }
spotbugs-tool = { module = "com.github.spotbugs:spotbugs", version.ref = "spotbugs" }

[plugins]
shadow = { id = "com.gradleup.shadow", version = "9.6.1" }
graalvm-native = { id = "org.graalvm.buildtools.native", version = "1.1.14" }
